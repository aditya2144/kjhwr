# One command to run everything locally:  docker compose up --build
# App -> http://localhost:8080   API docs -> http://localhost:8000/docs
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
